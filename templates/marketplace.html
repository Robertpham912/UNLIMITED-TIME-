<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Time - Chợ Vật Phẩm</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between p-4 max-w-4xl mx-auto space-y-6">

    <div class="flex justify-between items-center bg-slate-950 border border-slate-800 p-4 rounded-xl shadow-md">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-slate-400 hover:text-emerald-400 transition">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <div>
                <h1 class="text-sm font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-shop"></i> CHỢ ĐEN GAME VẬT PHẨM
                </h1>
                <p class="text-[10px] text-slate-500 font-medium">Giao dịch trang bị trực tuyến trước trận đấu</p>
            </div>
        </div>
        <button onclick="toggleModal(true)" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-extrabold text-xs uppercase px-4 py-2 rounded-lg transition-all flex items-center gap-1.5 shadow-lg shadow-emerald-600/10">
            <i class="fa-solid fa-plus text-xs"></i> Đăng Bán Trang Bị
        </button>
    </div>

    <div class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl min-h-[400px]">
        <div id="loadingStatus" class="flex flex-col items-center justify-center py-20 text-slate-500 space-y-2">
            <i class="fa-solid fa-circle-notch animate-spin text-2xl text-emerald-500"></i>
            <span class="text-xs font-semibold uppercase tracking-wider">Đang tải vật phẩm từ hệ thống...</span>
        </div>
        
        <div id="itemGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            </div>
    </div>

    <div id="itemModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
        <div class="bg-slate-900 border border-slate-800 max-w-sm w-full p-6 rounded-2xl shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-xs font-black text-slate-200 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-box-open text-cyan-400"></i> ĐĂNG KÝ VẬT PHẨM MỚI
                </h3>
                <button onclick="toggleModal(false)" class="text-slate-500 hover:text-slate-300 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="itemForm" onsubmit="handleAddItem(event)" class="space-y-3">
                <div class="space-y-1">
                    <label class="block text-[10px] font-bold uppercase text-slate-400">Tên trang bị/Vật phẩm</label>
                    <input type="text" id="itemName" required placeholder="Ví dụ: Kiếm Vô Cực, Giáp Thần Long..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-cyan-500 text-slate-200">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-bold uppercase text-slate-400">Giá bán (Coin)</label>
                    <input type="number" id="itemPrice" required min="1" placeholder="Nhập số tiền..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-cyan-500 text-slate-200">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-bold uppercase text-slate-400">Tên người bán (IGN)</label>
                    <input type="text" id="itemSeller" required placeholder="Nhập tên của cậu..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-cyan-500 text-slate-200">
                </div>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-extrabold text-xs uppercase py-2.5 rounded-lg transition-all mt-2">
                    Xác Nhận Treo Chợ
                </button>
            </form>
        </div>
    </div>

    <script>
        // Đồng bộ kết nối với Server Firebase cộng đồng miễn phí
        const firebaseConfig = { databaseURL: "https://unlimited-time-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const marketRef = database.ref('marketplace');

        // Bật/Tắt Pop-up điền thông tin đồ
        function toggleModal(show) {
            const modal = document.getElementById('itemModal');
            if (show) modal.classList.remove('hidden');
            else { modal.classList.add('hidden'); document.getElementById('itemForm').reset(); }
        }

        // Đẩy vật phẩm lên database đám mây
        function handleAddItem(event) {
            event.preventDefault();
            const name = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value;
            const seller = document.getElementById('itemSeller').value.trim();

            marketRef.push({
                name: name,
                price: parseInt(price),
                seller: seller,
                timestamp: Date.now()
            }, (error) => {
                if (!error) {
                    toggleModal(false);
                } else {
                    alert("Có lỗi xảy ra khi treo đồ!");
                }
            });
        }

        // Lắng nghe dữ liệu real-time từ Firebase đổ về lưới vật phẩm
        marketRef.on('value', (snapshot) => {
            const grid = document.getElementById('itemGrid');
            const loading = document.getElementById('loadingStatus');
            grid.innerHTML = '';
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                // Sắp xếp vật phẩm mới đăng lên đầu
                const sortedItems = Object.values(data).sort((a, b) => b.timestamp - a.timestamp);

                sortedItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col justify-between space-y-3 shadow-md hover:border-slate-700 transition";
                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="text-[9px] font-bold tracking-wider text-slate-500 uppercase flex items-center gap-1">
                                <i class="fa-solid fa-tag text-cyan-500"></i> Trang bị game
                            </div>
                            <h4 class="text-xs font-extrabold text-slate-200 tracking-wide break-words">${item.name}</h4>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-950">
                            <div class="text-[10px] text-slate-400 font-medium">Kẻ bán: <span class="text-emerald-400 font-bold">${item.seller}</span></div>
                            <div class="text-xs font-black text-amber-400 flex items-center gap-1 bg-amber-950/30 border border-amber-900/40 px-2 py-1 rounded-lg">
                                <i class="fa-solid fa-coins"></i> ${item.price.toLocaleString()}
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            } else {
                loading.innerHTML = `
                    <i class="fa-solid fa-box-open text-2xl text-slate-700 mb-1"></i>
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Chợ đang trống, hãy là người đầu tiên đăng đồ!</span>
                `;
            }
        });
    </script>
</body>
</html>
