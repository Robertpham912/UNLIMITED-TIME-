<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Time - Sảnh Chờ & Trận Đấu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col p-4 max-w-2xl mx-auto justify-between space-y-4">

    <div class="flex justify-between items-center bg-slate-950 border border-slate-800 p-4 rounded-xl shadow-md">
        <div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-emerald-400 flex items-center space-x-1.5">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="statusText">Trạng thái: Trong Phòng Chờ</span>
            </div>
            <h3 class="text-sm font-extrabold text-slate-200">
                SERVER ID: <span id="displayId" class="text-cyan-400 font-mono select-all"></span>
            </h3>
        </div>
        <div class="text-xs text-slate-400 font-medium bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">
            Tên: <span id="displayUser" class="text-emerald-400 font-bold"></span>
        </div>
    </div>

    <div id="lobbyView" class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-center space-y-4 shadow-md">
        <div class="flex items-center justify-center space-x-2 text-cyan-400 text-sm font-bold">
            <i class="fa-solid fa-hourglass-half animate-bounce"></i>
            <h2 class="uppercase tracking-wide">Sảnh Chờ Trực Tuyến</h2>
        </div>
        <p class="text-[11px] text-slate-400">Hãy gửi mã phòng phía trên cho đồng đội. Cậu có thể chat chém gió ở khung bên dưới trong lúc đợi!</p>

        <div id="actionArea" class="w-full max-w-xs mx-auto pt-2 border-t border-slate-900">
            </div>
    </div>

    <div id="chatView" class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl flex flex-col min-h-0 shadow-xl overflow-hidden">
        <div id="messageBox" class="flex-1 overflow-y-auto p-4 space-y-3">
            <div id="systemNotice" class="text-center py-2">
                <span class="text-[10px] bg-amber-950/40 text-amber-400 border border-amber-900/30 px-2 py-0.5 rounded-full uppercase font-bold tracking-wider">
                    Kênh chat phòng chờ đã mở - Hãy gáy trước trận đi nào!
                </span>
            </div>
        </div>
        
        <form id="chatForm" onsubmit="sendMessage(event)" class="p-3 bg-slate-950 border-t border-slate-900 flex gap-2">
            <input type="text" id="chatInput" placeholder="Nhập nội dung trò chuyện..." autocomplete="off" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs px-4 rounded-xl transition-all">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = { databaseURL: "https://unlimited-time-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Lấy thông tin URL
        const urlParams = new URLSearchParams(window.location.search);
        const serverId = urlParams.get('server_id') || 'UT-ROOM';
        const role = urlParams.get('role') || 'player';
        const username = urlParams.get('username') || 'Player';

        document.getElementById('displayId').innerText = serverId;
        document.getElementById('displayUser').innerText = username;

        const roomRef = database.ref('rooms/' + serverId);

        // Hiển thị nút bấm trong phòng chờ dựa theo vai trò
        const actionArea = document.getElementById('actionArea');
        if (role === 'owner') {
            actionArea.innerHTML = `
                <button onclick="startMatch()" class="w-full bg-cyan-500 text-slate-950 font-extrabold text-xs uppercase py-2.5 rounded-xl hover:bg-cyan-400 transition-all shadow-lg shadow-cyan-500/10">BẮT ĐẦU TRẬN ĐẤU (START)</button>
                <p class="text-[9px] text-cyan-500/60 mt-1.5">Cậu là Chủ phòng. Hãy bấm nút khi đồng đội đã sẵn sàng.</p>
            `;
            // Cài đặt trạng thái ban đầu là chưa bắt đầu trận
            roomRef.child('started').transaction((currentValue) => {
                if (currentValue === null) return false;
            });
        } else {
            actionArea.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 text-slate-400 text-[11px] font-semibold py-2.5 rounded-xl animate-pulse">ĐANG ĐỢI CHỦ PHÒNG BẤM START...</div>
            `;
        }

        // Theo dõi trạng thái trận đấu từ Firebase Real-time
        roomRef.child('started').on('value', (snapshot) => {
            if (snapshot.val() === true) {
                // Khi chủ phòng bấm nút: Ẩn phần sảnh chờ phía trên đi
                document.getElementById('lobbyView').classList.add('hidden');
                
                // Đổi đèn tín hiệu trạng thái sang màu xanh lá cây chiến đấu
                document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('statusText').innerText = "Trạng thái: Trận Đấu Đã Bắt Đầu";
                
                // Thay đổi dòng thông báo hệ thống trong hộp chat
                document.getElementById('systemNotice').innerHTML = `
                    <span class="text-[10px] bg-emerald-950/40 text-emerald-400 border border-emerald-900/30 px-2 py-0.5 rounded-full uppercase font-bold tracking-wider">
                        Trận đấu chính thức kích hoạt! Chiến thôi!
                    </span>
                `;
            }
        });

        // Lắng nghe luồng tin nhắn chat đổ về (Hỗ trợ chat ngay trong lúc chờ)
        roomRef.child('messages').on('child_added', (snapshot) => {
            const data = snapshot.val();
            const messageBox = document.getElementById('messageBox');
            const isMe = (data.user === username);
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-0.5`;
            msgDiv.innerHTML = `
                <span class="text-[10px] font-bold ${isMe ? 'text-emerald-400' : 'text-cyan-400'} px-1">${data.user}</span>
                <div class="max-w-[85%] text-xs px-3 py-2 rounded-2xl ${isMe ? 'bg-emerald-600 text-slate-950 font-medium rounded-tr-none' : 'bg-slate-900 text-slate-200 border border-slate-800 rounded-tl-none'} break-all">${data.msg}</div>
            `;
            messageBox.appendChild(msgDiv);
            messageBox.scrollTop = messageBox.scrollHeight;
        });

        // Hàm xử lý khi Chủ phòng bấm nút START
        function startMatch() {
            roomRef.child('started').setValue(true);
        }

        // Hàm xử lý gửi tin nhắn chat
        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            if (!input.value.trim()) return;
            
            roomRef.child('messages').push({
                user: username,
                msg: input.value.trim()
            });
            input.value = "";
        }
    </script>
</body>
</html>
